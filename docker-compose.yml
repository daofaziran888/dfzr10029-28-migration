services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      # 数据集市的分区、事实与迁移记录落在挂载卷里，重启后仍可按版本回查。
      - MART_DB_PATH=/srv/app/var/data_mart.sqlite3
    volumes:
      - mart-data:/srv/app/var
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # 前端容器里的 127.0.0.1 是它自己，必须走 Compose 服务名访问后端。
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  mart-data:
